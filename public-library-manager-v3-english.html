dding:10px 13px;font-size:12px;font-weight:600}.primary{background:var(--green);color:white}.primary:hover{background:#104a34}.secondary{background:white;border-color:#d9e5dd;color:#3b5948}.secondary:hover{background:#f5faf6}.danger{background:#fff0ed;color:var(--red);border-color:#f3d2cc}.small{padding:7px 9px;font-size:11px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:17px}.toolbar h2{margin:0 0 5px;font-size:21px}.toolbar p{margin:0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.formtitle{font-weight:700;font-size:14px;margin-bottom:15px}.formtitle small{font-size:11px;font-weight:400;color:var(--muted);margin-left:7px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.fields label,.settingslabel{display:grid;gap:7px;font-size:11px;font-weight:600;color:#52675a}.fields input,.fields select,.fields textarea,.settingslabel input,.settingslabel select,.searchbox input,.searchlarge input{width:100%;border:1px solid #dce6df;border-radius:7px;padding:10px 11px;outline:none;background:white;color:var(--ink);font-size:12px}.fields input:focus,.fields select:focus,.fields textarea:focus,.settingslabel input:focus,.searchbox input:focus{border-color:#6fb28b;box-shadow:0 0 0 3px #e8f6ed}.wide{grid-column:1/-1}.help{font-size:10px;font-weight:400;color:#849188}.formactions{display:flex;gap:8px;margin-top:16px}.tablepanel{padding:16px 0 0}.tablepanel .panelhead{padding:0 16px}.searchbox{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:0 9px;min-width:190px;color:#829188}.searchbox input{border:0;box-shadow:none!important;padding:9px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#f7faf8;text-align:left;color:#75857a;font-size:10px;padding:12px 14px;border-top:1px solid #eaf0ec;border-bottom:1px solid #eaf0ec;white-space:nowrap}td{padding:12px 14px;border-bottom:1px solid #edf1ee;color:#465a4d;vertical-align:middle}tbody tr:hover{background:#fbfdfb}td strong{color:#233b2e}td small{display:block;font-size:10px;color:#859188;margin-top:4px}.pill{display:inline-block;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:700;white-space:nowrap}.green{background:#e4f6e9;color:#267247}.blue{background:#eaf0ff;color:#3c62a4}.redpill{background:#ffe9e6;color:#ac4439}.gray{background:#edf0ee;color:#68746c}.notice{padding:12px 14px;border-radius:8px;background:#eef5f0;color:#4c6655;font-size:12px;margin:0 0 14px}.notice.success{background:#e3f7e9;color:#20683e}.notice.error{background:#fff0ed;color:#a33e32}.empty{text-align:center;padding:24px;color:#89958d;font-size:12px}.recent{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf1ee}.recent:last-child{border:0}.bookicon{width:32px;height:32px;border-radius:8px;background:#edf7ef;display:grid;place-items:center;color:#267653}.recentbody{flex:1;min-width:0}.recentbody strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recentbody small{font-size:10px;color:#829087;display:block;margin-top:4px}.searchlarge{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:16px}.searchlarge input{border:0;box-shadow:none!important;padding:16px 0;font-size:14px}.reportgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.reportcard{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.reportcard .r-icon{font-size:22px;color:#267653}.reportcard h3{margin:12px 0 7px;font-size:14px}.reportcard p{font-size:12px;color:var(--muted);line-height:1.6}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.settingslabel{margin:15px 0}.settingslabel input,.settingslabel select{font-weight:400}.full{width:100%;margin-top:10px}.storage{border-top:1px solid var(--line);padding-top:16px;margin-top:17px;display:flex;gap:10px;align-items:center}.storage strong,.storage small{display:block;font-size:12px}.storage small{font-size:10px;color:var(--muted);margin-top:4px}.footer{border-top:1px solid var(--line);padding:15px 30px;display:flex;justify-content:space-between;color:#849188;font-size:10px}.hidden{display:none!important}.toast{position:fixed;right:24px;bottom:22px;max-width:420px;padding:13px 17px;background:#183e2f;color:white;border-radius:10px;box-shadow:0 8px 30px #153a2926;z-index:10;font-size:12px}.modalback{position:fixed;inset:0;background:#14291f77;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:white;border-radius:14px;padding:23px;width:min(500px,100%);box-shadow:0 20px 70px #14291f30}.modal h3{margin:0 0 10px}.modal p{font-size:12px;color:var(--muted);line-height:1.6}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:1050px){.side{width:205px}.content{padding:20px}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.reportgrid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.shell{display:block}.side{width:100%;padding:10px}.brand{padding:3px 8px 12px}.brand-icon{width:35px;height:35px}.nav{display:flex;overflow:auto}.nav button{width:auto;flex-shrink:0;padding:9px}.nav button span:last-child{display:none}.sidefoot{display:none}.top{height:74px;padding:12px 16px}.top h1{font-size:18px}.content{padding:16px}.welcome{padding:20px}.welcome h2{font-size:19px}.welcome .bigbook{font-size:38px}.fields,.settingsgrid,.reportgrid{grid-template-columns:1fr}.wide{grid-column:auto}.toolbar{align-items:flex-start;flex-direction:column}.panelhead{flex-wrap:wrap}.searchbox{min-width:150px}.footer{padding:14px 16px}}

<body>
<div class="shell">
<aside class="side">
  <div class="brand"><div class="brand-icon">▤</div><div><strong id="brandName">Public Library</strong><small>Library Management</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-screen="dashboard"><span class="ico">▦</span><span data-i="dashboard">ഡാഷ്ബോർഡ്</span></button>
    <button data-screen="books"><span class="ico">▤</span><span data-i="books">പുസ്തകങ്ങൾ</span></button>
    <button data-screen="members"><span class="ico">♙</span><span data-i="members">അംഗങ്ങൾ</span></button>
    <button data-screen="issue"><span class="ico">⇄</span><span data-i="issue">പുസ്തകം നൽകുക</span></button>
    <button data-screen="returns"><span class="ico">↩</span><span data-i="returns">തിരികെ വാങ്ങുക</span></button>
    <button data-screen="history"><span class="ico">▤</span><span data-i="history">ഇടപാട് ചരിത്രം</span></button>
    <button data-screen="search"><span class="ico">⌕</span><span data-i="search">തിരയൽ</span></button>
    <button data-screen="reports"><span class="ico">▥</span><span data-i="reports">റിപ്പോർട്ടുകൾ</span></button>
    <button data-screen="settings"><span class="ico">⚙</span><span data-i="settings">ക്രമീകരണങ്ങൾ</span></button>
  </nav>
  <div class="sidefoot"><span class="dot"></span><span data-i="localdb">ഈ കമ്പ്യൂട്ടറിൽ ഡാറ്റ</span></div>
</aside>
<main class="main">
<header class="top"><div><div class="eyebrow">PUBLIC LIBRARY / READING ROOM</div><h1 id="pageTitle">ഡാഷ്ബോർഡ്</h1></div><div class="topright"><button class="btn secondary" id="langBtn">English</button></div></header>
<div class="content" id="content"></div>
<footer class="footer"><span>Public Library Manager · Phase 1 HTML v2</span><span id="footerStatus">Local browser storage</span></footer>
</main></div>
<div id="toast" class="toast hidden"></div>
<input id="importFile" type="file" accept=".csv,text/csv" class="hidden">
<input id="restoreFile" type="file" accept=".json,application/json" class="hidden">
<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const KEY='public_library_manager_html_v1';
const today=()=>new Date().toISOString().slice(0,10);
const datePlus=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const dict={
ml:{dashboard:'ഡാഷ്ബോർഡ്',books:'പുസ്തകങ്ങൾ',members:'അംഗങ്ങൾ',issue:'പുസ്തകം നൽകുക',returns:'തിരികെ വാങ്ങുക',history:'ഇടപാട് ചരിത്രം',search:'തിരയൽ',reports:'റിപ്പോർട്ടുകൾ',settings:'ക്രമീകരണങ്ങൾ',titles:'പുസ്തക ശീർഷകങ്ങൾ',copies:'ആകെ കോപ്പികൾ',available:'ലഭ്യമായവ',issued:'നൽകിയവ',overdue:'കാലാവധി കഴിഞ്ഞവ',activeMembers:'സജീവ അംഗങ്ങൾ',quick:'വേഗത്തിലുള്ള പ്രവർത്തനങ്ങൾ',addBook:'പുസ്തകം ചേർക്കുക',addMember:'അംഗത്തെ ചേർക്കുക',recent:'പുതിയ ഇടപാടുകൾ',save:'സേവ് ചെയ്യുക',cancel:'റദ്ദാക്കുക',titleMl:'മലയാളം പേര്',titleEn:'ഇംഗ്ലീഷ് പേര്',author:'രചയിതാവ്',publisher:'പ്രസാധകൻ',isbn:'ISBN',language:'ഭാഷ',accession:'ആക്സഷൻ നമ്പർ(കൾ)',name:'അംഗത്തിന്റെ പേര്',phone:'ഫോൺ',address:'വിലാസം',memberId:'അംഗ നമ്പർ',issueDate:'നൽകിയ തീയതി',dueDate:'തിരികെ നൽകേണ്ട തീയതി',selectMember:'അംഗത്തെ തിരഞ്ഞെടുക്കുക',selectCopy:'ലഭ്യമായ കോപ്പി തിരഞ്ഞെടുക്കുക',status:'നില',actions:'പ്രവർത്തനങ്ങൾ',noData:'രേഖകളൊന്നുമില്ല',searchPlaceholder:'പുസ്തകം, രചയിതാവ്, അംഗം, ആക്സഷൻ നമ്പർ തിരയുക...',inventory:'പുസ്തക രജിസ്റ്റർ',loanRegister:'നിലവിലെ Issue രജിസ്റ്റർ',overdueReport:'കാലാവധി കഴിഞ്ഞവ',libraryName:'ലൈബ്രറിയുടെ പേര്',loanPeriod:'പുസ്തകം നൽകുന്ന ദിവസങ്ങൾ',maxLoans:'ഒരു അംഗത്തിന് അനുവദിക്കുന്ന പരമാവധി പുസ്തകങ്ങൾ',backup:'ബാക്കപ്പ് എടുക്കുക',restore:'ബാക്കപ്പ് പുനഃസ്ഥാപിക്കുക',import:'CSV Import',export:'CSV Export',localdb:'ഈ കമ്പ്യൂട്ടറിൽ ഡാറ്റ',fineRate:'ഒരു ദിവസത്തെ പിഴ (₹)',bookSaved:'പുസ്തകം സേവ് ചെയ്തു',memberSaved:'അംഗത്തെ ചേർത്തു',issuedOk:'പുസ്തകം നൽകി',returnedOk:'പുസ്തകം തിരികെ വാങ്ങി',confirmReturn:'ഈ പുസ്തകം തിരികെ വാങ്ങണോ?',required:'ആവശ്യമായ വിവരങ്ങൾ നൽകുക.',overdueDays:'വൈകിയ ദിവസങ്ങൾ'},
en:{dashboard:'Dashboard',books:'Books',members:'Members',issue:'Issue Book',returns:'Return Book',history:'Transaction History',search:'Search',reports:'Reports',settings:'Settings',titles:'Book titles',copies:'Physical copies',available:'Available',issued:'Issued',overdue:'Overdue',activeMembers:'Active members',quick:'Quick actions',addBook:'Add Book',addMember:'Add Member',recent:'Recent activity',save:'Save',cancel:'Cancel',titleMl:'Malayalam title',titleEn:'English title',author:'Author',publisher:'Publisher',isbn:'ISBN',language:'Language',accession:'Accession number(s)',name:'Member name',phone:'Phone',address:'Address',memberId:'Member ID',issueDate:'Issue date',dueDate:'Due date',selectMember:'Select member',selectCopy:'Select available copy',status:'Status',actions:'Actions',noData:'No records found',searchPlaceholder:'Search title, author, member, accession number...',inventory:'Book register',loanRegister:'Active loan register',overdueReport:'Overdue books',libraryName:'Library name',loanPeriod:'Default loan period (days)',maxLoans:'Maximum books per member',backup:'Back up database',restore:'Restore backup',import:'Import CSV',export:'Export CSV',localdb:'Data stored on this computer',fineRate:'Fine per overdue day (₹)',bookSaved:'Book saved',memberSaved:'Member added',issuedOk:'Book issued',returnedOk:'Book returned',confirmReturn:'Return this book?',required:'Please fill the required fields.',overdueDays:'Overdue days'}
};
let lang='en', screen='dashboard', query='', db=load();
function blank(){return {books:[],copies:[],members:[],loans:[],settings:{libraryName:'Public Library',loanPeriod:14,maxLoans:3,fineRate:0,language:'ml'}}}
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return blank()}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function t(k){return (dict[lang]||dict.ml)[k]||k}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const el=$('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3200)}
function setScreen(s){screen=s;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===s));render()}
function stat(label,value,icon){return `<div class="stat"><div class="badgeico">${icon}</div><div class="label">${label}</div><strong>${value}</strong></div>`}
function titleOf(b){return lang==='ml'?(b.titleMl||b.titleEn):(b.titleEn||b.titleMl)}
function copyBook(copy){return db.books.find(b=>b.id===copy.bookId)||{}}
function availableCopies(q=''){q=q.toLowerCase();return db.copies.filter(c=>c.status==='available').filter(c=>{let b=copyBook(c);return `${c.accession} ${b.titleMl} ${b.titleEn} ${b.author}`.toLowerCase().includes(q)})}
function activeLoans(q=''){q=q.toLowerCase();return db.loans.filter(l=>!l.returnDate).filter(l=>{let m=db.members.find(x=>x.id===l.memberId)||{},c=db.copies.find(x=>x.id===l.copyId)||{},b=copyBook(c);return `${m.name} ${m.memberNo} ${c.accession} ${b.titleMl} ${b.titleEn}`.toLowerCase().includes(q)})}
function searchBooks(q=''){q=q.toLowerCase();return db.books.filter(b=>`${b.titleMl} ${b.titleEn} ${b.author} ${b.publisher} ${b.isbn}`.toLowerCase().includes(q)).filter(b=>!b.archived)}
function render(){
  $('#brandName').textContent=db.settings.libraryName||'Public Library';$('#pageTitle').textContent=t(screen==='returns'?'returns':screen);
  $$('#nav [data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  $('#content').innerHTML=screen==='dashboard'?dashboard():screen==='books'?booksPage():screen==='members'?membersPage():screen==='issue'?issuePage():screen==='returns'?returnsPage():screen==='history'?historyPage():screen==='search'?searchPage():screen==='reports'?reportsPage():settingsPage();
  $('#langBtn').textContent=lang==='ml'?'English':'മലയാളം';
}
function dashboard(){
 const titles=db.books.filter(b=>!b.archived).length,copies=db.copies.filter(c=>c.status!=='archived').length,available=db.copies.filter(c=>c.status==='available').length,issued=db.copies.filter(c=>c.status==='issued').length,overdue=db.loans.filter(l=>!l.returnDate&&l.dueDate<today()).length,members=db.members.filter(m=>m.status==='active').length;
 const recent=[...db.loans].sort((a,b)=>b.id-a.id).slice(0,6);

  const m=db.members.find(x=>x.id===l.memberId)||{},c=db.copies.find(x=>x.id===l.copyId)||{},b=copyBook(c);

  rows.push([l.id,m.memberNo||'',m.name||'',b.titleMl||'',b.titleEn||'',c.accession||'',l.issueDate||'',l.dueDate||'',l.returnDate||'',status,l.fineAssessed||0]);
 });

function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCsv(){const rows=[['Title Malayalam','Title English','Author','Publisher','ISBN','Language','Accession Number','Status']];db.copies.forEach(c=>{let b=copyBook(c);rows.push([b.titleMl,b.titleEn,b.author,b.publisher,b.isbn,b.language,c.accession,c.status])});download('library-books.csv','\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV export created')}
function backup(){download('library-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('Backup file created')}
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const text=await file.text(),rows=parseCSV(text);if(rows.length<2)throw Error('No data rows found.');const headers=rows[0].map(h=>h.trim().toLowerCase()),get=(r,...names)=>{let i=headers.findIndex(h=>names.includes(h));return i<0?'':String(r[i]||'').trim()};let imported=0,errors=[];const staged=[];rows.slice(1).forEach((r,i)=>{const titleEn=get(r,'title','book title','title english','title_en'),titleMl=get(r,'malayalam title','title malayalam','title_ml'),accession=get(r,'accession number','accession_no','accession');if(!titleEn&&!titleMl){errors.push(`Row ${i+2}: missing title`);return}if(!accession){errors.push(`Row ${i+2}: missing accession number`);return}if(db.copies.some(c=>c.accession.toLowerCase()===accession.toLowerCase())||staged.some(s=>s.accession.toLowerCase()===accession.toLowerCase())){errors.push(`Row ${i+2}: duplicate accession ${accession}`);return}staged.push({titleEn,titleMl,author:get(r,'author'),publisher:get(r,'publisher'),isbn:get(r,'isbn'),language:get(r,'language'),accession})});if(!confirm(`Rows found: ${rows.length-1}\nValid rows: ${staged.length}\nErrors: ${errors.length}\nImport valid rows?`)){e.target.value='';return}staged.forEach(s=>{let b=db.books.find(b=>b.titleEn===s.titleEn&&b.titleMl===s.titleMl&&b.author===s.author);if(!b){b={id:Date.now()+Math.random(),titleMl:s.titleMl,titleEn:s.titleEn,author:s.author,publisher:s.publisher,isbn:s.isbn,language:s.language,createdAt:today()};db.books.push(b)}db.copies.push({id:Date.now()+Math.random(),bookId:b.id,accession:s.accession,status:'available'});imported++});persist();toast(`Imported ${imported}; rejected ${errors.length}`);if(errors.length)alert(errors.join('\n'))}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(cell.length||row.length){row.push(cell);rows.push(row)}return rows}
$('#restoreFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.books)||!Array.isArray(incoming.copies)||!Array.isArray(incoming.members)||!Array.isArray(incoming.loans))throw Error('This does not look like a library backup.');if(!confirm('Restore this backup? Current data will be replaced. Make a backup first if needed.'))return;download('library-before-restore-'+today()+'.json',JSON.stringify(db,null,2),'application/json');db={...blank(),...incoming};lang=db.settings.language||lang;persist();toast('Backup restored')}catch(err){alert('Restore failed: '+err.message)}finally{e.target.value=''}};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-screen]');if(b)setScreen(b.dataset.screen)});
$('#langBtn').onclick=()=>{lang=lang==='ml'?'en':'ml';db.settings.language=lang;localStorage.setItem(KEY,JSON.stringify(db));render()};
render();bind();
// Rebind controls after each screen render.
const observer=new MutationObserver(()=>bind());observer.observe($('#content'),{childList:true,subtree:false});
</script>
</body>
